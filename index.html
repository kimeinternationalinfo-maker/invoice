<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KIME INTERNATIONAL - Invoice System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb;
  --red:#e0263a; --orange:#f5893d; --accent-grad:linear-gradient(90deg,var(--red),var(--orange));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#15161a; --card:#1f2025; --ink:#eee; --muted:#9aa0aa; --line:#33343a; } }
:root[data-theme="dark"]{ --bg:#15161a; --card:#1f2025; --ink:#eee; --muted:#9aa0aa; --line:#33343a; }
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px;}
header.top{display:flex;align-items:center;gap:14px;padding:16px 0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
header.top img{width:56px;height:56px;border-radius:50%;}
header.top h1{font-size:1.25rem;margin:0;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
header.top p{margin:2px 0 0;color:var(--muted);font-size:.85rem;}
.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap;}
.tab-btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:.9rem;}
.tab-btn.active{background:var(--accent-grad);color:#fff;border-color:transparent;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.grid2{grid-template-columns:1fr;}}
label{display:block;font-size:.78rem;color:var(--muted);margin:0 0 4px;font-weight:600;}
input,textarea{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:.92rem;font-family:inherit;}
textarea{resize:vertical;min-height:38px;}
.field{margin-bottom:12px;}
table{width:100%;border-collapse:collapse;margin-top:6px;}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem;}
th{color:var(--muted);font-size:.75rem;text-transform:uppercase;}
td input{padding:6px 8px;font-size:.88rem;}
.amt-col,.qty-col{width:90px;}
.rm-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem;}
.btn{padding:10px 18px;border-radius:9px;border:none;cursor:pointer;font-weight:600;font-size:.9rem;}
.btn-primary{background:var(--accent-grad);color:#fff;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.totals{max-width:260px;margin-left:auto;margin-top:10px;}
.totals-row{display:flex;justify-content:space-between;padding:5px 0;font-size:.9rem;}
.totals-row.total{font-weight:800;font-size:1.05rem;border-top:2px solid var(--ink);margin-top:4px;padding-top:8px;}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:.9rem;cursor:pointer;}
.hist-item:hover{background:rgba(128,128,128,.06);}
.chip{padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:700;}
.chip.paid{background:#e0263a22;color:var(--red);}
.chip.pending{background:#f5893d22;color:var(--orange);}

/* ---- Printable invoice ---- */
#invoiceSheet{background:#fff;color:#111;width:800px;max-width:100%;margin:0 auto;padding:40px;position:relative;overflow:hidden;border-radius:6px;}
.deco1{position:absolute;top:-60px;right:-80px;width:260px;height:260px;background:#e6e6e6;border-radius:50%;z-index:0;}
.deco2{position:absolute;top:0;right:0;width:150px;height:80px;background:var(--red);border-radius:0 0 0 100px;z-index:1;}
.inv-head{position:relative;z-index:2;display:flex;align-items:center;gap:16px;}
.inv-head img{width:78px;height:78px;border-radius:50%;}
.inv-title{font-size:2.3rem;font-weight:900;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:22px 0 4px;letter-spacing:1px;}
.inv-meta{font-size:.85rem;color:#333;margin-bottom:18px;}
.inv-cols{display:flex;justify-content:space-between;gap:30px;position:relative;z-index:2;margin-bottom:14px;}
.inv-col h4{font-size:.8rem;letter-spacing:1px;margin:0 0 8px;}
.inv-col .r{font-size:.85rem;margin-bottom:4px;color:#222;}
.inv-col .r b{display:inline-block;width:70px;color:#555;font-weight:700;}
table.inv-table{width:100%;border-collapse:collapse;margin-top:10px;position:relative;z-index:2;}
table.inv-table thead th{background:var(--accent-grad);color:#fff;padding:9px 8px;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;text-align:left;}
table.inv-table thead th:nth-child(3),table.inv-table thead th:nth-child(4){text-align:right;}
table.inv-table tbody td{padding:8px;font-size:.85rem;border-bottom:1px solid #eee;}
table.inv-table tbody td:nth-child(3),table.inv-table tbody td:nth-child(4){text-align:right;}
.inv-totals{max-width:230px;margin-left:auto;margin-top:16px;position:relative;z-index:2;}
.inv-totals .row{display:flex;justify-content:space-between;padding:5px 8px;font-size:.85rem;border:1px solid #ddd;border-top:none;}
.inv-totals .row:first-child{border-top:1px solid #ddd;}
.inv-totals .total{background:var(--accent-grad);color:#fff;font-weight:800;padding:9px 8px;display:flex;justify-content:space-between;margin-top:6px;font-size:.95rem;}
.stamp{position:absolute;bottom:60px;right:70px;border:4px solid var(--red);color:var(--red);font-weight:900;font-size:1.6rem;padding:8px 22px;border-radius:8px;transform:rotate(-14deg);opacity:.85;letter-spacing:2px;z-index:3;}
.deco3{position:absolute;bottom:-70px;left:-90px;width:220px;height:220px;background:#e6e6e6;border-radius:50%;z-index:0;}
.deco4{position:absolute;bottom:0;left:0;width:130px;height:70px;background:var(--red);border-radius:0 100px 0 0;z-index:1;}
@media print{ body *{visibility:hidden;} #invoiceSheet,#invoiceSheet *{visibility:visible;} #invoiceSheet{position:absolute;top:0;left:0;width:100%;} }
.hidden{display:none;}
.empty{color:var(--muted);font-size:.88rem;text-align:center;padding:20px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img id="logoTop" src="" alt="KIME logo">
    <div>
      <h1>KIME INTERNATIONAL</h1>
      <p>Invoice & Sales System <span id="syncStatus" style="color:var(--muted);">— checking sync...</span></p>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="new">බිල් අලුත් එක</button>
    <button class="tab-btn" data-tab="history">Sales History</button>
  </div>

  <!-- NEW INVOICE FORM -->
  <div id="tab-new">
    <div class="card">
      <div class="grid2">
        <div class="field"><label>Invoice Number</label><input id="invNo" disabled></div>
        <div class="field"><label>Date & Time</label><input id="invDate" disabled></div>
      </div>
      <div class="grid2">
        <div>
          <label style="font-size:.72rem;color:var(--muted);text-transform:uppercase;">FROM (auto)</label>
          <div style="font-size:.85rem;line-height:1.5;margin-top:4px;">
            <b>Kime Apparels</b><br>074 3826699<br>Near Bodhirajarama Temple, Ratnapura 70012
          </div>
        </div>
        <div>
          <label>Customer Name</label><input id="custName" placeholder="Customer name">
          <label style="margin-top:8px;">Customer Number</label><input id="custNum" placeholder="07XXXXXXXX">
          <label style="margin-top:8px;">Customer Address</label><textarea id="custAddr" placeholder="Address"></textarea>
        </div>
      </div>
    </div>

    <div class="card">
      <label style="margin-bottom:10px;">Items</label>
      <table id="itemTable">
        <thead><tr><th>Description</th><th class="qty-col">Qty</th><th class="amt-col">Unit Price</th><th class="amt-col">Amount</th><th></th></tr></thead>
        <tbody id="itemBody"></tbody>
      </table>
      <button class="btn btn-ghost" id="addRow" style="margin-top:10px;">+ Item එකක් එකතු කරන්න</button>

      <div class="totals">
        <div class="totals-row"><span>Sub Total</span><span id="subTotalView">0.00</span></div>
        <div class="field" style="margin-top:6px;"><label>Advance</label><input id="advance" type="number" value="0" min="0"></div>
        <div class="totals-row total"><span>Total</span><span id="totalView">0.00</span></div>
      </div>
      <div class="field" style="margin-top:10px;"><label style="display:inline-flex;align-items:center;gap:8px;"><input type="checkbox" id="paidCheck" style="width:auto;"> PAID ලෙස සලකුණු කරන්න</label></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="genBtn">Invoice එක Generate කරන්න</button>
    </div>

    <div id="previewWrap" class="hidden" style="margin-top:22px;">
      <div id="invoiceSheet"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="downloadPdf">PDF Download කරන්න</button>
        <button class="btn btn-ghost" id="printBtn">Print</button>
        <button class="btn btn-ghost" id="saveBtn">Save & New</button>
      </div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="tab-history" class="hidden">
    <div class="card">
      <div class="btn-row" style="margin-top:0;margin-bottom:10px;">
        <button class="btn btn-ghost" id="exportBtn">සියලු Data Backup (JSON) Download</button>
      </div>
      <div id="histList"></div>
    </div>
  </div>
</div>

document.getElementById('logoTop').src = LOGO_SRC;

const FROM = {name:"Kime Apparels", phone:"074 3826699", addr:"Near Bodhirajarama Temple, Ratnapura 70012"};

// ---- cloud storage (syncs across every device you're signed in on) ----
let db = null;
let cloudReady = false;
let cachedInvoices = [];

async function initStorage(){
  try{
    if(window.claude && window.claude.use){ db = await window.claude.use('db'); }
  }catch(e){ db = null; }
  if(db){
    try{
      const snap = await db.collection('invoices').orderBy('createdAt','desc').limit(500).get();
      cachedInvoices = snap.docs.map(d=>d.data());
    }catch(e){ cachedInvoices = []; }
  } else {
    cachedInvoices = getLocalInvoices();
  }
  cloudReady = true;
  const statusEl = document.getElementById('syncStatus');
  if(statusEl) statusEl.textContent = db ? '— ☁ Cloud sync on (හැම device එකකින්ම පේනවා)' : '— මේ device එකේ විතරයි save වෙන්නේ';
  setHeader();
  renderHistory();
}
function getLocalInvoices(){ try{return JSON.parse(localStorage.getItem('kime_invoices')||'[]');}catch(e){return [];} }
function setLocalInvoices(list){ try{localStorage.setItem('kime_invoices', JSON.stringify(list));}catch(e){} }

async function saveInvoice(data){
  data.createdAt = Date.now();
  if(db){
    await db.collection('invoices').add(data);
  } else {
    const list = getLocalInvoices();
    list.unshift(data);
    setLocalInvoices(list);
  }
  cachedInvoices.unshift(data);
}

function nextInvoiceNo(){
  return 'INV-'+String(cachedInvoices.length+1).padStart(4,'0');
}

let currentInvNo = null;
function setHeader(){
  currentInvNo = nextInvoiceNo();
  document.getElementById('invNo').value = currentInvNo;
  document.getElementById('invDate').value = new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

// ---- item rows ----
const itemBody = document.getElementById('itemBody');
function addRow(){
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><input class="desc" placeholder="Item description"></td>
    <td class="qty-col"><input class="qty" type="number" value="1" min="0"></td>
    <td class="amt-col"><input class="price" type="number" value="0" min="0"></td>
    <td class="amt-col amount">0.00</td>
    <td><button class="rm-btn" title="Remove">✕</button></td>`;
  tr.querySelector('.qty').addEventListener('input', updateTotals);
  tr.querySelector('.price').addEventListener('input', updateTotals);
  tr.querySelector('.rm-btn').addEventListener('click', ()=>{ tr.remove(); updateTotals(); });
  itemBody.appendChild(tr);
}
document.getElementById('addRow').addEventListener('click', addRow);
for(let i=0;i<3;i++) addRow();

function updateTotals(){
  let subtotal = 0;
  itemBody.querySelectorAll('tr').forEach(tr=>{
    const qty = parseFloat(tr.querySelector('.qty').value)||0;
    const price = parseFloat(tr.querySelector('.price').value)||0;
    const amt = qty*price;
    tr.querySelector('.amount').textContent = amt.toFixed(2);
    subtotal += amt;
  });
  const advance = parseFloat(document.getElementById('advance').value)||0;
  document.getElementById('subTotalView').textContent = subtotal.toFixed(2);
  document.getElementById('totalView').textContent = (subtotal-advance).toFixed(2);
  return {subtotal, advance, total: subtotal-advance};
}
document.getElementById('advance').addEventListener('input', updateTotals);
updateTotals();
initStorage();

// ---- generate invoice sheet ----
function buildInvoiceHTML(data){
  const rows = data.items.map((it,i)=>`<tr><td>${i+1}. ${it.desc||''}</td><td>${it.qty}</td><td>${it.price.toFixed(2)}</td><td>${(it.qty*it.price).toFixed(2)}</td></tr>`).join('');
  return `
  <div class="deco1"></div><div class="deco2"></div><div class="deco3"></div><div class="deco4"></div>
  <div class="inv-head"><img src="${LOGO_SRC}"></div>
  <div class="inv-title">INVOICE</div>
  <div class="inv-meta">Invoice Number: ${data.invNo}<br>Date: ${data.date}</div>
  <div class="inv-cols">
    <div class="inv-col"><h4>FROM</h4>
      <div class="r"><b>Name</b>${FROM.name}</div>
      <div class="r"><b>Number</b>${FROM.phone}</div>
      <div class="r"><b>Address</b>${FROM.addr}</div>
    </div>
    <div class="inv-col"><h4>TO</h4>
      <div class="r"><b>Name</b>${data.cust.name||'-'}</div>
      <div class="r"><b>Number</b>${data.cust.num||'-'}</div>
      <div class="r"><b>Address</b>${data.cust.addr||'-'}</div>
    </div>
  </div>
  <table class="inv-table"><thead><tr><th>Item</th><th>Qty</th><th>Unit Price</th><th>Amount</th></tr></thead>
  <tbody>${rows}</tbody></table>
  <div class="inv-totals">
    <div class="row"><span>Advance</span><span>${data.advance.toFixed(2)}</span></div>
    <div class="row"><span>Sub Total</span><span>${data.subtotal.toFixed(2)}</span></div>
    <div class="total"><span>TOTAL</span><span>${data.total.toFixed(2)}</span></div>
  </div>
  ${data.paid ? '<div class="stamp">PAID</div>' : ''}
  `;
}

let lastInvoiceData = null;
document.getElementById('genBtn').addEventListener('click', ()=>{
  const t = updateTotals();
  const items = [...itemBody.querySelectorAll('tr')].map(tr=>({
    desc: tr.querySelector('.desc').value,
    qty: parseFloat(tr.querySelector('.qty').value)||0,
    price: parseFloat(tr.querySelector('.price').value)||0
  })).filter(it=>it.desc.trim()!=='');
  if(items.length===0){ alert('අඩුම තරමින් item එකක් description එකක් සමඟ දාන්න.'); return; }
  lastInvoiceData = {
    invNo: currentInvNo,
    date: document.getElementById('invDate').value,
    cust: { name: document.getElementById('custName').value, num: document.getElementById('custNum').value, addr: document.getElementById('custAddr').value },
    items, subtotal: t.subtotal, advance: t.advance, total: t.total,
    paid: document.getElementById('paidCheck').checked
  };
  document.getElementById('invoiceSheet').innerHTML = buildInvoiceHTML(lastInvoiceData);
  document.getElementById('previewWrap').classList.remove('hidden');
  document.getElementById('previewWrap').scrollIntoView({behavior:'smooth'});
});

document.getElementById('downloadPdf').addEventListener('click', ()=>{
  const el = document.getElementById('invoiceSheet');
  html2pdf().set({margin:0, filename:(lastInvoiceData.invNo)+'.pdf', image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2, backgroundColor:'#ffffff'}, jsPDF:{unit:'pt',format:'a4',orientation:'portrait'}}).from(el).save();
});
document.getElementById('printBtn').addEventListener('click', ()=> window.print());

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  if(!lastInvoiceData) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try{
    await saveInvoice(lastInvoiceData);
  }catch(e){ alert('Save වුනේ නෑ, network එක check කරලා try කරන්න.'); btn.disabled=false; btn.textContent='Save & New'; return; }
  btn.disabled = false; btn.textContent = 'Save & New';
  alert('Invoice එක save කළා: '+lastInvoiceData.invNo+(db?' (cloud එකට sync වුනා)':' (මේ device එකේ save වුනා)'));
  document.getElementById('previewWrap').classList.add('hidden');
  itemBody.innerHTML=''; for(let i=0;i<3;i++) addRow();
  document.getElementById('custName').value=''; document.getElementById('custNum').value=''; document.getElementById('custAddr').value='';
  document.getElementById('advance').value=0; document.getElementById('paidCheck').checked=false;
  setHeader(); updateTotals();
  renderHistory();
});

// ---- history ----
function renderHistory(){
  const list = cachedInvoices;
  const el = document.getElementById('histList');
  if(!cloudReady){ el.innerHTML = '<div class="empty">Loading...</div>'; return; }
  if(list.length===0){ el.innerHTML = '<div class="empty">තවම invoice save කරලා නෑ.</div>'; return; }
  el.innerHTML = list.map((inv,idx)=>`
    <div class="hist-item" data-idx="${idx}">
      <div><b>${inv.invNo}</b> — ${inv.cust.name||'No name'}<br><span style="color:var(--muted);font-size:.78rem;">${inv.date}</span></div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="chip ${inv.paid?'paid':'pending'}">${inv.paid?'PAID':'PENDING'}</span>
        <b>Rs. ${inv.total.toFixed(2)}</b>
      </div>
    </div>`).join('');
  el.querySelectorAll('.hist-item').forEach(node=>{
    node.addEventListener('click', ()=>{
      const inv = list[node.dataset.idx];
      lastInvoiceData = inv;
      switchTab('new');
      document.getElementById('invoiceSheet').innerHTML = buildInvoiceHTML(inv);
      document.getElementById('previewWrap').classList.remove('hidden');
      document.getElementById('previewWrap').scrollIntoView({behavior:'smooth'});
    });
  });
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const data = { invoices: cachedInvoices };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kime_sales_backup_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
});

// ---- tabs ----
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.getElementById('tab-new').classList.toggle('hidden', name!=='new');
  document.getElementById('tab-history').classList.toggle('hidden', name!=='history');
  if(name==='history') renderHistory();
}
document.querySelectorAll('.tab-btn').forEach(b=> b.addEventListener('click', ()=>switchTab(b.dataset.tab)));
</script>
</body>
</html>
